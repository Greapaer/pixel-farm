<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Pixel Farm — pixel tycoon. Plant, water, harvest and grow your farm! / Пиксель Ферма — кликер-тайкон.">
<link rel="icon" href="assets/img/coin.png">
<title>Pixel Farm</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #2b2a33; overflow: hidden;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #game { width: 100%; height: 100%; }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    -webkit-user-select: none; user-select: none;
  }
  @font-face {
    font-family: 'Press Start 2P';
    src: url('assets/fonts/PressStart2P-Regular.ttf') format('truetype');
    font-weight: 400; font-display: block;
  }
</style>
</head>
<body>
  <div id="game"></div>
  <script src="js/phaser.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
